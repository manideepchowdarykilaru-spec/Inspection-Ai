# Render blueprint: one web service runs the API and serves the built frontend.
# Create the database first (Render Postgres or Neon), then set DATABASE_URL in
# the service's environment. Pick the same region as the database.
services:
  - type: web
    name: lm-inspect-ai
    runtime: node
    plan: starter            # 2 GB RAM: OCR over a 12 MP photograph needs the headroom
    region: ohio             # match your database region (Neon us-east-2 = Ohio)
    # --include=dev: NODE_ENV=production would otherwise skip the build tooling
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=1536
      - key: DATABASE_URL
        sync: false          # paste the connection string in the dashboard
      - key: AUTH_SECRET
        generateValue: true  # Render generates a random signing secret
      # Optional: one-time-code delivery. Set in the dashboard; unset = codes shown on screen.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: OCR_PROVIDER
        sync: false
      - key: GOOGLE_VISION_API_KEY
        sync: false
      - key: OCRSPACE_API_KEY
        sync: false
